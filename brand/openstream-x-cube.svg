<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">OpenStream X to cube animated mark</title>
  <desc id="description">Two luminous strokes form an X, fold into an isometric cube, then return in a three second loop.</desc>
  <defs>
    <linearGradient id="edgeA" x1="112" y1="400" x2="400" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EE8B2"/>
      <stop offset="0.52" stop-color="#79B8FF"/>
      <stop offset="1" stop-color="#B989FF"/>
    </linearGradient>
    <linearGradient id="edgeB" x1="112" y1="112" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6FCFF"/>
      <stop offset="0.5" stop-color="#79B8FF"/>
      <stop offset="1" stop-color="#4EE8B2"/>
    </linearGradient>
    <linearGradient id="topFace" x1="256" y1="82" x2="256" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9C0FF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#79B8FF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="88" y1="168" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4EE8B2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#14372E" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="424" y1="168" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79B8FF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#182947" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.18  0 1 0 0 0.55  0 0 1 0 0.84  0 0 0 .7 0" result="colored"/>
      <feMerge><feMergeNode in="colored"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="safeFrame"><rect x="64" y="64" width="384" height="384" rx="96"/></clipPath>
  </defs>
  <style>
    .reduced { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .animated { display: none; }
      .reduced { display: inline; }
    }
  </style>

  <g class="animated" clip-path="url(#safeFrame)" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#glow)">
      <path d="M132 380 L380 132" fill="none" stroke="url(#edgeA)" stroke-width="38">
        <animate attributeName="d" dur="3s" repeatCount="indefinite"
          keyTimes="0;.18;.38;.68;.88;1"
          values="M132 380 L380 132;M132 380 L380 132;M256 420 L256 256;M256 420 L256 256;M132 380 L380 132;M132 380 L380 132"
          calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.18;.4;.68;.88;1"/>
      </path>
      <path d="M132 132 L380 380" fill="none" stroke="url(#edgeB)" stroke-width="38">
        <animate attributeName="d" dur="3s" repeatCount="indefinite"
          keyTimes="0;.18;.38;.68;.88;1"
          values="M132 132 L380 380;M132 132 L380 380;M256 256 L96 164;M256 256 L96 164;M132 132 L380 380;M132 132 L380 380"
          calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.18;.4;.68;.88;1"/>
      </path>
    </g>

    <g stroke-width="9" filter="url(#glow)">
      <polygon points="256,256 256,256 256,256 256,256" fill="url(#topFace)" stroke="#CDB5FF">
        <animate attributeName="points" dur="3s" repeatCount="indefinite"
          keyTimes="0;.2;.4;.68;.86;1"
          values="256,256 256,256 256,256 256,256;256,256 256,256 256,256 256,256;256,256 96,164 256,72 416,164;256,256 96,164 256,72 416,164;256,256 256,256 256,256 256,256;256,256 256,256 256,256 256,256"
          calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.2;.4;.68;.86;1"/>
      </polygon>
      <polygon points="256,256 256,256 256,256 256,256" fill="url(#leftFace)" stroke="#4EE8B2">
        <animate attributeName="points" dur="3s" repeatCount="indefinite"
          keyTimes="0;.2;.4;.68;.86;1"
          values="256,256 256,256 256,256 256,256;256,256 256,256 256,256 256,256;256,256 96,164 96,348 256,440;256,256 96,164 96,348 256,440;256,256 256,256 256,256 256,256;256,256 256,256 256,256 256,256"
          calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.2;.4;.68;.86;1"/>
      </polygon>
      <polygon points="256,256 256,256 256,256 256,256" fill="url(#rightFace)" stroke="#79B8FF">
        <animate attributeName="points" dur="3s" repeatCount="indefinite"
          keyTimes="0;.2;.4;.68;.86;1"
          values="256,256 256,256 256,256 256,256;256,256 256,256 256,256 256,256;256,256 416,164 416,348 256,440;256,256 416,164 416,348 256,440;256,256 256,256 256,256 256,256;256,256 256,256 256,256 256,256"
          calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.2;.4;.68;.86;1"/>
      </polygon>
    </g>
  </g>

  <g class="reduced" stroke-linecap="round" filter="url(#glow)">
    <path d="M132 380 L380 132" fill="none" stroke="url(#edgeA)" stroke-width="38"/>
    <path d="M132 132 L380 380" fill="none" stroke="url(#edgeB)" stroke-width="38"/>
  </g>
</svg>
