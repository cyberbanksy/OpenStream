<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenStream animated mark preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        color: #f7fafc;
        background:
          radial-gradient(circle at 50% 34%, rgba(60, 102, 140, .30), transparent 38%),
          #050707;
        font: 600 18px/1.4 system-ui, sans-serif;
      }
      main { display: grid; justify-items: center; gap: 22px; }
      .tile {
        width: 512px;
        height: 512px;
        border: 1px solid rgba(255, 255, 255, .09);
        border-radius: 112px;
        background: rgba(255, 255, 255, .025);
        box-shadow: 0 40px 100px rgba(0, 0, 0, .48);
      }
      p { margin: 0; color: #aeb9bf; letter-spacing: .035em; }
    </style>
  </head>
  <body>
    <main>
      <img class="tile" src="openstream-x-cube.svg" alt="OpenStream animated X-to-cube mark" />
      <p>OpenStream · X to cube · 3 second loop</p>
    </main>
  </body>
</html>
